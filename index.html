        // -------------------------------------------------------------------
        // 1. AUDIO FEEDBACK ENGINE (Tone.js - Tanpa URL Eksternal)
        // -------------------------------------------------------------------
        let soundEnabled = true;
        let synth = null;

        function playSound(type) {
            if (!soundEnabled) return;
            try {
                if (!synth) {
                    synth = new Tone.PolySynth(Tone.Synth).toDestination();
                    synth.volume.value = -12;
                }
                if (Tone.context.state !== 'running') {
                    Tone.start();
                }
                if (type === 'click') {
                    synth.triggerAttackRelease("C5", "32n");
                } else if (type === 'success') {
                    synth.triggerAttackRelease(["C5", "E5", "G5"], "16n");
                } else if (type === 'error') {
                    synth.triggerAttackRelease(["A3", "Eb3"], "16n");
                }
            } catch (e) {
                // Abaikan jika browser memblokir audio sebelum interaksi user
            }
        }

        document.getElementById('sound-toggle').addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            const icon = document.getElementById('sound-icon');
            const label = document.querySelector('#sound-toggle span');
            if (soundEnabled) {
                icon.className = 'ph-fill ph-speaker-high text-base text-natural-sage';
                label.textContent = 'Audio Aktif';
                playSound('click');
            } else {
                icon.className = 'ph-fill ph-speaker-slash text-base text-natural-muted';
                label.textContent = 'Audio Mati';
            }
        });

            document.getElementById('toast-msg').textContent = msg;

            if (type === 'success') {
                icon.className = 'ph-fill ph-check-circle text-xl text-emerald-400 shrink-0 mt-0.5';
            } else if (type === 'warning') {
                icon.className = 'ph-fill ph-warning-circle text-xl text-amber-400 shrink-0 mt-0.5';
            } else {
                icon.className = 'ph-fill ph-info text-xl text-sky-400 shrink-0 mt-0.5';
            }

            box.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                box.classList.add('translate-y-20', 'opacity-0');
            }, 3200);
        }

        function updateProgress() {
            const completedCount = modules.filter(m => m.completed).length;
            const pct = Math.round((completedCount / modules.length) * 100);
            document.getElementById('progress-text').textContent = `${pct}%`;
            document.getElementById('progress-bar').style.width = `${pct}%`;
        }

        function navigateTo(moduleId) {
            playSound('click');
            currentModuleId = moduleId;

            // Tandai modul saat ini sebagai dikunjungi/selesai
            const modIndex = modules.findIndex(m => m.id === moduleId);
            if (modIndex !== -1) {
                modules[modIndex].completed = true;
            }

            // Tutup mobile drawer jika terbuka
            document.getElementById('sidebar-nav').classList.add('-translate-x-full');
            document.getElementById('sidebar-overlay').classList.add('hidden');

            renderSidebar();
            renderStage();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Mobile Drawer Handlers
        document.getElementById('mobile-menu-btn').addEventListener('click', () => {
            document.getElementById('sidebar-nav').classList.remove('-translate-x-full');
            document.getElementById('sidebar-overlay').classList.remove('hidden');
        });
        document.getElementById('close-menu-btn').addEventListener('click', () => {
            document.getElementById('sidebar-nav').classList.add('-translate-x-full');
            document.getElementById('sidebar-overlay').classList.add('hidden');
        });
        document.getElementById('sidebar-overlay').addEventListener('click', () => {
            document.getElementById('sidebar-nav').classList.add('-translate-x-full');
            document.getElementById('sidebar-overlay').classList.add('hidden');
        });

        // Prev & Next Footer Buttons
        document.getElementById('btn-prev').addEventListener('click', () => {
            const idx = modules.findIndex(m => m.id === currentModuleId);
            if (idx > 0) navigateTo(modules[idx - 1].id);
        });

        document.getElementById('btn-next').addEventListener('click', () => {
            const idx = modules.findIndex(m => m.id === currentModuleId);
            if (idx < modules.length - 1) {
                navigateTo(modules[idx + 1].id);

            const btnNext = document.getElementById('btn-next');
            const stepInd = document.getElementById('step-indicator');

            const idx = modules.findIndex(m => m.id === currentModuleId);

            if (idx !== -1) {
                footer.classList.remove('hidden');
                btnPrev.disabled = idx === 0;
                stepInd.textContent = `Tahap ${idx + 1} dari ${modules.length} • Target: ${modules[idx].cpmk}`;
                btnNext.innerHTML = idx === modules.length - 1
                    ? `<span>Ulangi dari Awal</span><i class="ph ph-arrow-counter-clockwise"></i>`
                    : `<span>Lanjut Materi</span><i class="ph ph-arrow-right"></i>`;
            } else {
                // Halaman khusus Blueprint Desain Pembelajaran
                footer.classList.add('hidden');
            }

            switch (currentModuleId) {
                case 'orientasi':
                    body.innerHTML = getOrientasiHTML();
                    break;
                case 'penerapan':
                    body.innerHTML = getPenerapanHTML();
                    selectDailyApp('supermarket');
                    break;
                case 'file-vs-db':
                    body.innerHTML = getFileVsDbHTML();

                case 'dbms-arsitektur':

                case 'evaluasi':
                    body.innerHTML = getEvaluasiHTML();

                case 'design-blueprint':
                    body.innerHTML = getDesignBlueprintHTML();
                    break;

                        return `
                            <button onclick="submitQuizAnswer(${i})" ${userChoice !== null ? 'disabled' : ''}
                                class="w-full text-left p-3.5 rounded-xl border transition-all flex items-start gap-3 ${btnStyle}">
                                <span class="w-6 h-6 rounded-lg text-xs font-bold flex items-center justify-center shrink-0 mt-0.5 ${badgeStyle}">
                                    ${String.fromCharCode(65 + i)}
                                </span>
                                <span class="text-xs sm:text-sm leading-relaxed">${opt}</span>
                            </button>
                        `;
                    }).join('')}
                </div>

                <!-- Umpan Balik Pedagogis Langsung (Immediate Explanatory Feedback) -->
                ${userChoice !== null ? `
                    <div class="p-4 rounded-xl mb-5 border ${userChoice === qObj.answer ? 'bg-natural-sageLight/70 border-natural-sage/40' : 'bg-natural-terraLight/70 border-natural-terra/40'}">
                        <p class="text-xs font-bold mb-1 ${userChoice === qObj.answer ? 'text-natural-sageDark' : 'text-natural-terra'}">
                            ${userChoice === qObj.answer ? '✓ Jawaban Benar!' : '✕ Kurang Tepat'}
                        </p>
                        <p class="text-xs sm:text-sm text-natural-ink leading-relaxed">${qObj.explanation}</p>
                    </div>
                ` : ''}

                <!-- Navigasi Antar Soal -->
                <div class="flex items-center justify-between pt-3 border-t border-natural-border">
                    <button onclick="changeQuizQuestion(-1)" ${currentQuizIndex === 0 ? 'disabled' : ''}
                        class="px-3.5 py-2 rounded-lg border border-natural-border bg-natural-surface text-xs font-bold text-natural-ink disabled:opacity-40">
                        ← Soal Sebelumnya
                    </button>

                    ${currentQuizIndex < quizQuestions.length - 1 ? `
                        <button onclick="changeQuizQuestion(1)"
                            class="px-4 py-2 rounded-lg bg-natural-sage text-white text-xs font-bold hover:bg-natural-sageDark">
                            Soal Berikutnya →
                        </button>
                    ` : `
                        <button onclick="resetQuiz()"
                            class="px-4 py-2 rounded-lg bg-natural-terra text-white text-xs font-bold hover:opacity-90">
                            Ulangi Kuis
                        </button>
                    `}
                </div>
            `;
        }

        function submitQuizAnswer(selectedIndex) {
            if (quizAnswered[currentQuizIndex] !== null) return;

            quizAnswered[currentQuizIndex] = selectedIndex;
            const isCorrect = selectedIndex === quizQuestions[currentQuizIndex].answer;

            if (isCorrect) {
                quizScore++;
                playSound('success');
                showToast('Jawaban Tepat!', 'Pemahaman konsep Anda sangat baik.', 'success');
            } else {
                playSound('error');
                showToast('Periksa Penjelasan', 'Silakan baca pembahasan di bawah opsi jawaban.', 'warning');
            }

            renderQuizQuestion();
        }

        function changeQuizQuestion(delta) {
            playSound('click');
            const nextIdx = currentQuizIndex + delta;
            if (nextIdx >= 0 && nextIdx < quizQuestions.length) {
                currentQuizIndex = nextIdx;
                renderQuizQuestion();
            }
        }

        function resetQuiz() {
            playSound('click');
            currentQuizIndex = 0;
            quizScore = 0;
            quizAnswered = new Array(quizQuestions.length).fill(null);
            renderQuizQuestion();
            showToast('Kuis Direset', 'Silakan kerjakan kembali kuis evaluasi.', 'info');
        }

        // HALAMAN KHUSUS: DOKUMEN RANCANGAN PEMBELAJARAN (INSTRUCTIONAL DESIGN)
